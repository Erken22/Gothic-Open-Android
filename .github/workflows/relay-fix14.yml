name: Relay FIX14 APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/relay-fix14.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - name: Download private release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download exact-064-fix13 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "GothicLauncher-arm64-Exact064-FIX13-IME-CULL-PERF.apk"
          mv GothicLauncher-arm64-Exact064-FIX13-IME-CULL-PERF.apk \
             GothicLauncher-arm64-Exact064-FIX14-FRUSTUM-FALLBACK.apk
          sha256sum GothicLauncher-arm64-Exact064-FIX14-FRUSTUM-FALLBACK.apk
      - name: Relay APK
        shell: bash
        run: |
          FILE="GothicLauncher-arm64-Exact064-FIX14-FRUSTUM-FALLBACK.apk"
          RESP="$(curl --connect-timeout 20 --max-time 300 --fail --silent --show-error \
            -F "file=@$FILE" https://upload.gofile.io/uploadfile)"
          echo "$RESP" | jq .
          STATUS="$(printf '%s' "$RESP" | jq -r '.status // empty')"
          test "$STATUS" = "ok"
          PAGE="$(printf '%s' "$RESP" | jq -r '.data.downloadPage // .data.downloadPageUrl // empty')"
          FILEID="$(printf '%s' "$RESP" | jq -r '.data.fileId // .data.id // empty')"
          FOLDER="$(printf '%s' "$RESP" | jq -r '.data.parentFolder // .data.folderId // empty')"
          TOKEN="$(printf '%s' "$RESP" | jq -r '.data.guestToken // empty')"
          echo "GOFILE_PAGE=$PAGE"
          echo "GOFILE_FILE_ID=$FILEID"
          echo "GOFILE_FOLDER_ID=$FOLDER"
          echo "GOFILE_GUEST_TOKEN=$TOKEN"
