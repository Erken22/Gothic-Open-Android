name: Export FIX12 APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-fix12.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Download FIX12 from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download exact-064-fix12             --repo "$GITHUB_REPOSITORY"             --pattern "GothicLauncher-arm64-Exact064-FIX12-SAVE-HIZ.apk"
          sha256sum GothicLauncher-arm64-Exact064-FIX12-SAVE-HIZ.apk
      - name: Upload chat artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIX12-APK
          path: GothicLauncher-arm64-Exact064-FIX12-SAVE-HIZ.apk
          compression-level: 0
