name: Build Modern Direct Folder GraphicsFix9
# workflow revision: graphicsfix9-lazy-acquire-safe-static-lod-miui-resume

on:
  push:
    branches: [main]
    paths:
      - 'apply_overlay.py'
      - 'apply_tempest_resume.py'
      - 'apply_cpu_profiler.py'
      - 'overlay/**'
      - '.github/workflows/direct-folder-modern.yml'
  workflow_dispatch:

concurrency:
  group: modern-direct-folder-adreno650
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_TYPE: "Release"

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6

      - name: Clone current OpenGothic Android fork
        run: |
          git clone --branch touch-ui --recurse-submodules --shallow-submodules --depth 1 \
            https://github.com/borsuczyna/OpenGothic-Android.git src

      - name: Apply direct-folder, graphics and resume overlay
        run: python3 apply_overlay.py src

      - name: Apply detailed CPU frame profiler
        run: python3 apply_cpu_profiler.py src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Install Vulkan headers
        shell: bash
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          mkdir -p VulkanSDK/include
          cp -a Vulkan-Headers/include/. VulkanSDK/include/
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/VulkanSDK" >> "$GITHUB_ENV"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Generate build version
        run: |
          {
            echo '#pragma once'
            echo "static const char* appBuild = \"Direct Folder Adreno650 GraphicsFix9 $GITHUB_SHA\";"
          } > src/game/build.h

      - name: Configure Android ARM64
        run: |
          GRADLE="$RUNNER_TEMP/.gradle-actions/gradle-installations/installs/gradle-8.9/bin/gradle"
          test -x "$GRADLE"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S src -B src/build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DTEMPEST_ANDROID_GRADLE_EXECUTABLE="$GRADLE"

      - name: Apply Tempest Android resume lifecycle patch
        run: python3 apply_tempest_resume.py src

      - name: Enable AndroidX if generated project needs it
        run: |
          if [ -f src/build/android/OpenGothic-apk/gradle.properties ]; then
            echo "android.useAndroidX=true" >> src/build/android/OpenGothic-apk/gradle.properties
          fi

      - name: Build APK
        run: |
          GRADLE="$RUNNER_TEMP/.gradle-actions/gradle-installations/installs/gradle-8.9/bin/gradle"
          "$GRADLE" -p src/build/android/OpenGothic-apk --no-daemon --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" assembleRelease

      - name: Collect and verify APK
        shell: bash
        run: |
          APK=""
          while IFS= read -r candidate; do
            if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$candidate" 2>/dev/null | grep -q "package: name='org.opengothic.mobile'"; then
              APK="$candidate"
              break
            fi
          done < <(find src/build/android -path '*/build/outputs/apk/*/*.apk' -type f | sort)

          test -n "$APK"
          OUT="OpenGothic-Gothic2-DirectFolder-Adreno650-GraphicsFix9-arm64.apk"
          cp "$APK" "$OUT"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$OUT" | tee apk-permissions.txt
          grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" apk-permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | head -n 12 | tee apk-badging.txt
          sha256sum "$OUT" | tee apk-sha256.txt

      - name: Publish modern direct-folder release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete direct-folder-modern-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create direct-folder-modern-latest \
            OpenGothic-Gothic2-DirectFolder-Adreno650-GraphicsFix9-arm64.apk \
            apk-permissions.txt apk-badging.txt apk-sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenGothic Modern Direct Folder - GraphicsFix9" \
            --notes "Modern Android fork / ARM64 Release. Performance pass from device CPU timings: lazy swapchain acquire so game tick/UI can overlap display progress, Android prefers MAILBOX/FIFO_RELAXED before FIFO, far static VOBs regain conservative LOD and HiZ while characters/morph/water remain full and non-occluded. Keeps triple buffering. Resume rendering no longer waits for MIUI GAINED_FOCUS; RESUME+NativeWindow is sufficient. Detailed per-stage profiling remains enabled." \
            --prerelease
