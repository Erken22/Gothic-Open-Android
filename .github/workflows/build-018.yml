name: Build OpenGothic 0.6.7 FIX18 Hybrid

on:
  push:
    branches: [fix18-067-hybrid]
    paths:
      - apply_067.py
      - .github/workflows/build-018.yml
  workflow_dispatch:

concurrency:
  group: opengothic-067-fix18
  cancel-in-progress: true

permissions:
  contents: write

env:
  OPENGOTHIC_COMMIT: "18336539f4b1a8d7b325930f613811f59fbde5db"
  BUILD_TYPE: "Release"

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Clone exact OpenGothic 0.6.7 source
        shell: bash
        run: |
          git clone https://github.com/Solessfir/OpenGothic.git src
          cd src
          git checkout "$OPENGOTHIC_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$OPENGOTHIC_COMMIT"

      - name: Apply FIX18
        run: python3 apply_067.py src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Install Android/Vulkan build tools
        shell: bash
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          mkdir -p VulkanSDK/include
          cp -a Vulkan-Headers/include/. VulkanSDK/include/
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/VulkanSDK" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.0.12077973"             "cmake;3.22.1"

      - name: Generate FIX18 build ID
        shell: bash
        run: |
          {
            echo '#pragma once'
            echo 'static const char* appBuild = "OpenGothic 0.6.7 FIX18 Hybrid";'
          } > src/game/build.h

      - name: Configure Android ARM64
        shell: bash
        run: |
          GRADLE="$RUNNER_TEMP/.gradle-actions/gradle-installations/installs/gradle-8.9/bin/gradle"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S src -B src/build/android -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE="$BUILD_TYPE"             -DOPENGOTHIC_ANDROID_GAME=launcher             -DTEMPEST_ANDROID_GRADLE_EXECUTABLE="$GRADLE"

      - name: Build release APK
        shell: bash
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build src/build/android --target OpenGothic-apk -- -j2

      - name: Sign and verify FIX18
        shell: bash
        run: |
          APK=""
          while IFS= read -r candidate; do
            if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$candidate" 2>/dev/null | grep -q "package: name='org.opengothic.launcher'"; then
              APK="$candidate"
              break
            fi
          done < <(find src/build/android -path '*/build/outputs/apk/*/*.apk' -type f | sort)
          test -n "$APK"

          OUT="GothicLauncher-arm64-OpenGothic067-FIX18-HYBRID.apk"
          base64 -d .ci/gothic_fix2.keystore.b64 > gothic_fix2.keystore
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks gothic_fix2.keystore             --ks-key-alias gothicfix2             --ks-pass pass:android             --key-pass pass:android             --out "$OUT" aligned-unsigned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | tee apk-badging.txt
          grep -q "versionName='0.6.7'" apk-badging.txt
          unzip -p "$OUT" lib/arm64-v8a/libopengothic.so > packaged-libopengothic.so
          strings packaged-libopengothic.so | grep -F "OpenGothic 0.6.7 FIX18 Hybrid"
          sha256sum "$OUT" | tee apk-sha256.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete exact-067-fix18 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create exact-067-fix18             GothicLauncher-arm64-OpenGothic067-FIX18-HYBRID.apk             apk-badging.txt apk-sha256.txt apk-signature.txt             --repo "$GITHUB_REPOSITORY"             --title "OpenGothic 0.6.7 FIX18 — Hybrid HiZ + CMAA2"             --notes "FIX18 keeps hero/NPC/vobs frustum-only on Adreno 650, restores conservative HiZ only for small landscape clusters, enables Android CMAA2 preset 1, keeps full 100% render scale, Direct Folder and all 0.6.7 lifecycle/Adreno fixes."             --prerelease
