name: Build Exact Gothic Launcher 0.6.4 FIX12

on:
  push:
    branches: [main]
    paths:
      - apply_exact_064.py
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: exact-gothic-launcher-064
  cancel-in-progress: true

permissions:
  contents: write

env:
  OPENGOTHIC_COMMIT: "7896a6436bac3735565658c5b5ce2bbb4a9e54a3"
  BUILD_TYPE: "Release"

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v6

      - name: Clone exact Gothic Launcher 0.6.4 source
        shell: bash
        run: |
          git clone https://github.com/Solessfir/OpenGothic.git src
          cd src
          git checkout "$OPENGOTHIC_COMMIT"
          git submodule update --init --recursive
          echo "OpenGothic: $(git rev-parse HEAD)"
          echo "Tempest: $(git -C lib/Tempest rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$OPENGOTHIC_COMMIT"
          test "$(git -C lib/Tempest rev-parse HEAD)" = "8c7c47fc03c6d774cde2fb2ec8240567c27a4817"

      - name: Apply Direct Folder, save and Adreno 650 fixes
        run: python3 apply_exact_064.py src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11"

      - name: Install Vulkan headers and Android build tools
        shell: bash
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          mkdir -p VulkanSDK/include
          cp -a Vulkan-Headers/include/. VulkanSDK/include/
          echo "VULKAN_SDK=$GITHUB_WORKSPACE/VulkanSDK" >> "$GITHUB_ENV"

          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.0.12077973"             "cmake;3.22.1"

      - name: Configure exact launcher ARM64
        shell: bash
        run: |
          GRADLE="$RUNNER_TEMP/.gradle-actions/gradle-installations/installs/gradle-8.11/bin/gradle"
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S src -B src/build/android -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-24             -DCMAKE_BUILD_TYPE="$BUILD_TYPE"             -DOPENGOTHIC_ANDROID_GAME=launcher             -DTEMPEST_ANDROID_GRADLE_EXECUTABLE="$GRADLE"

          echo "android.useAndroidX=true" >> src/build/android/android/OpenGothic-apk/gradle.properties

      - name: Build release APK
        shell: bash
        run: |
          GRADLE="$RUNNER_TEMP/.gradle-actions/gradle-installations/installs/gradle-8.11/bin/gradle"
          "$GRADLE" -p src/build/android/android/OpenGothic-apk             --no-daemon --max-workers=2             "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"             assembleRelease

      - name: Collect APK and unstripped native symbols
        shell: bash
        run: |
          APK=""
          while IFS= read -r candidate; do
            if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$candidate" 2>/dev/null | grep -q "package: name='org.opengothic.launcher'"; then
              APK="$candidate"
              break
            fi
          done < <(find src/build/android -path '*/build/outputs/apk/*/*.apk' -type f | sort)
          test -n "$APK"

          OUT="GothicLauncher-arm64-Exact064-FIX12-SAVE-HIZ.apk"
          base64 -d .ci/gothic_fix2.keystore.b64 > gothic_fix2.keystore
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks gothic_fix2.keystore \
            --ks-key-alias gothicfix2 \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" aligned-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT" | tee apk-signature.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | head -n 15 | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$OUT" | tee apk-permissions.txt
          grep -q "android.permission.MANAGE_EXTERNAL_STORAGE" apk-permissions.txt
          sha256sum "$OUT" | tee apk-sha256.txt

          # Keep the largest pre-Gradle-strip libopengothic.so. The Release build
          # intentionally retains -g symbols before APK packaging.
          SYMBOL="$(find src/build/android -type f -name 'libopengothic.so' -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$SYMBOL"
          cp "$SYMBOL" libopengothic-FIX12-unstripped.so
          file libopengothic-FIX12-unstripped.so | tee symbols-info.txt
          sha256sum libopengothic-FIX12-unstripped.so | tee symbols-sha256.txt

      - name: Publish FIX12 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete exact-064-fix12 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create exact-064-fix12             GothicLauncher-arm64-Exact064-FIX12-SAVE-HIZ.apk             libopengothic-FIX12-unstripped.so             apk-badging.txt apk-permissions.txt apk-sha256.txt             symbols-info.txt symbols-sha256.txt             --repo "$GITHUB_REPOSITORY"             --title "Gothic Launcher 0.6.4 FIX12 — save + Adreno 650 graphics"             --notes "Exact Solessfir/OpenGothic 0.6.4 source (7896a643...) and pinned Tempest (8c7c47fc...). Direct Folder is integrated in source. Adreno 650 uses OpenGothic flat material varyings and non-bindless material path. Android save-name IME queues no stale key-up after the widget closes. HiZ remains enabled, uses R32F and conservative bounds/depth bias to prevent false occlusion. No rendering feature is disabled. Unstripped native library is attached for exact future crash symbolication."             --prerelease
